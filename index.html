    function getChampionPortraitHtml(champ, sizeClass = 'w-11 h-11', roundedClass = 'rounded-lg', showFlexDot = false) {
      if (!champ) return '';
      const isFlex = champ.roles && champ.roles.length > 1;
      const borderColor = champ.color || '#38bdf8';
      const bgColor = `${champ.color || '#1e293b'}25`;
      const fallbackText = champ.name.slice(0, 3).toUpperCase();

      return `
        <div
          class="relative ${sizeClass} ${roundedClass} overflow-hidden shrink-0 border flex items-center justify-center select-none bg-slate-950"
          style="border-color: ${borderColor}; background-color: ${bgColor};"
        >
          <img
            src="${champ.imgUrl}"
            alt="${champ.name}"
            loading="lazy"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            class="w-full h-full object-cover object-center transform group-hover:scale-105 transition-transform duration-200"
          />
          <div style="display:none;" class="flex-col items-center justify-center w-full h-full bg-gradient-to-br from-slate-800 to-slate-950">
            <span class="text-xs font-black tracking-tighter text-amber-300">${fallbackText}</span>
          </div>
          ${showFlexDot && isFlex ? `
            <span
              class="absolute top-0.5 left-0.5 px-1 py-[1px] rounded bg-amber-500/95 text-slate-950 font-mono font-black text-[8px] leading-none shadow"
              title="Multi-Role Flex: ${champ.roles.join(' / ')}"
            >
              FLEX
            </span>
          ` : ''}
        </div>
      `;
    }

      const rChamps = rIds.map(id => (id ? CHAMP_MAP[id] : null));
      const sideAdvDelta = useSideAdv ? 1.6 : 0.0;

      let blueBaseDelta = 0;
      let redBaseDelta = 0;

      bChamps.forEach((c, idx) => {
        if (!c) return;
        const role = ROLES[idx];
        const roleSpecificWR = getChampRoleWR(c, role);
        const offRolePenalty = c.roles.includes(role) ? 0 : -1.2;
        blueBaseDelta += (roleSpecificWR - 50.0) * 0.52 + offRolePenalty;
      });

      rChamps.forEach((c, idx) => {
        if (!c) return;
        const role = ROLES[idx];
        const roleSpecificWR = getChampRoleWR(c, role);
        const offRolePenalty = c.roles.includes(role) ? 0 : -1.2;
        redBaseDelta += (roleSpecificWR - 50.0) * 0.52 + offRolePenalty;
      });

      const netBaseDelta = blueBaseDelta - redBaseDelta;

      let netLaneDelta = 0;
      const laneMatchups = ROLES.map((role, idx) => {
        const b = bChamps[idx];
        const r = rChamps[idx];
        if (!b || !r) {
          return {
            role,
            blueChamp: b,
            redChamp: r,
            gd15: 0,
            xpd15: 0,
            blueLaneWR: 50.0,
            smoothedDelta: 0,
            games: 0
          };
        }

        const directKey = `${b.id}:${r.id}`;
        const reverseKey = `${r.id}:${b.id}`;
        let gd15 = 0;
        let xpd15 = 0;
        let rawDelta = 0;
        let games = 2400;

        if (LANE_MATCHUP_TABLE[directKey]) {
          gd15 = LANE_MATCHUP_TABLE[directKey].gd15;
          xpd15 = LANE_MATCHUP_TABLE[directKey].xpd15;
          rawDelta = LANE_MATCHUP_TABLE[directKey].wrDelta;
          games = 5400;
        } else if (LANE_MATCHUP_TABLE[reverseKey]) {
          gd15 = -LANE_MATCHUP_TABLE[reverseKey].gd15;
          xpd15 = -LANE_MATCHUP_TABLE[reverseKey].xpd15;
          rawDelta = -LANE_MATCHUP_TABLE[reverseKey].wrDelta;
          games = 5400;
        } else {
          const earlyDiff = b.scaling[0] - r.scaling[0];
          const bRoleWR = getChampRoleWR(b, role);
          const rRoleWR = getChampRoleWR(r, role);
          gd15 = Math.round(earlyDiff * 55 + (bRoleWR - rRoleWR) * 45);
          xpd15 = Math.round(earlyDiff * 36 + (bRoleWR - rRoleWR) * 28);
          rawDelta = Number(((bRoleWR - rRoleWR) * 0.42 + earlyDiff * 0.18).toFixed(2));
          games = 1950;
        }

        const smoothedDelta = applyBayesianShrinkage(rawDelta, games, kValue);
        netLaneDelta += smoothedDelta * 0.55;

        return {
          role,
          blueChamp: b,
          redChamp: r,
          gd15,
          xpd15,
          blueLaneWR: Number((50 + smoothedDelta).toFixed(1)),
          smoothedDelta: Number(smoothedDelta.toFixed(2)),
          games
        };
      });

      const bPresentSet = new Set(bIds.filter(Boolean));
      const rPresentSet = new Set(rIds.filter(Boolean));

      const blueSynergies = [];
      const redSynergies = [];
      let blueSynTotal = 0;
      let redSynTotal = 0;

      SYNERGY_RULES.forEach(rule => {
        if (rule.champs.every(c => bPresentSet.has(c))) {
          const smoothed = applyBayesianShrinkage(rule.delta, rule.games, kValue);
          blueSynergies.push({ ...rule, smoothedDelta: Number(smoothed.toFixed(2)) });
          blueSynTotal += smoothed * 0.65;
        }
        if (rule.champs.every(c => rPresentSet.has(c))) {
          const smoothed = applyBayesianShrinkage(rule.delta, rule.games, kValue);
          redSynergies.push({ ...rule, smoothedDelta: Number(smoothed.toFixed(2)) });
          redSynTotal += smoothed * 0.65;
        }
      });

      const netSynergyDelta = blueSynTotal - redSynTotal;

      const blueCountersRed = [];
      const redCountersBlue = [];
      let blueCounterTotal = 0;
      let redCounterTotal = 0;

      COUNTER_RULES.forEach(rule => {
        if (bPresentSet.has(rule.attacker) && rPresentSet.has(rule.victim)) {
          const smoothed = applyBayesianShrinkage(rule.delta, rule.games, kValue);
          blueCountersRed.push({ ...rule, side: 'BLUE', smoothedDelta: Number(smoothed.toFixed(2)) });
          blueCounterTotal += smoothed * 0.7;
        }
        if (rPresentSet.has(rule.attacker) && bPresentSet.has(rule.victim)) {
          const smoothed = applyBayesianShrinkage(rule.delta, rule.games, kValue);
          redCountersBlue.push({ ...rule, side: 'RED', smoothedDelta: Number(smoothed.toFixed(2)) });
          redCounterTotal += smoothed * 0.7;
        }
      });

      const netCounterDelta = blueCounterTotal - redCounterTotal;

      const computeTeamProfile = (teamChamps) => {
        const valid = teamChamps.filter(Boolean);
        if (valid.length === 0) {
          return {
            isEmpty: true,
            dmgProfile: { ad: 0, ap: 0, true: 0 },
            scaling: [50.0, 50.0, 50.0],
            vectors: { cc: 0, frontline: 0, engage: 0, waveclear: 0, sidelane: 0 },
            neuralResidual: 0
          };
        }
        const count = valid.length;
        let ad = 0, ap = 0, tr = 0;
        let early = 0, mid = 0, late = 0;
        const vec = { cc: 0, frontline: 0, engage: 0, waveclear: 0, sidelane: 0 };

        valid.forEach(c => {
          ad += c.dmg.ad;
          ap += c.dmg.ap;
          tr += c.dmg.true;
          early += c.scaling[0];
          mid += c.scaling[1];
          late += c.scaling[2];
          vec.cc += c.vectors.cc;
          vec.frontline += c.vectors.frontline;
          vec.engage += c.vectors.engage;
          vec.waveclear += c.vectors.waveclear;
          vec.sidelane += c.vectors.sidelane;
        });

        const dmgSum = ad + ap + tr || 100;
        const dmgProfile = {
          ad: Math.round((ad / dmgSum) * 100),
          ap: Math.round((ap / dmgSum) * 100),
          true: Math.max(0, 100 - Math.round((ad / dmgSum) * 100) - Math.round((ap / dmgSum) * 100))
        };

        const avgVectors = {
          cc: Number((vec.cc / count).toFixed(1)),
          frontline: Number((vec.frontline / count).toFixed(1)),
          engage: Number((vec.engage / count).toFixed(1)),
          waveclear: Number((vec.waveclear / count).toFixed(1)),
          sidelane: Number((vec.sidelane / count).toFixed(1))
        };

        let neuralResidual = 0;
        if (valid.length >= 3) {
          if (dmgProfile.ad >= 76) neuralResidual -= 2.4;
          else if (dmgProfile.ap >= 74) neuralResidual -= 2.2;
          else neuralResidual += 0.8;

          if (avgVectors.frontline < 4.8) neuralResidual -= 1.9;
          if (avgVectors.cc < 5.2) neuralResidual -= 1.6;
        }

        return {
          isEmpty: false,
          dmgProfile,
          scaling: [
            Number((early / count).toFixed(1)),
            Number((mid / count).toFixed(1)),
            Number((late / count).toFixed(1))
          ],
          vectors: avgVectors,
          neuralResidual: Number(neuralResidual.toFixed(2))
        };
      };

      const blueProfile = computeTeamProfile(bChamps);
      const redProfile = computeTeamProfile(rChamps);
      const netNeuralResidual = blueProfile.neuralResidual - redProfile.neuralResidual;

      const pairwiseRawScore = sideAdvDelta + netBaseDelta + netLaneDelta + netSynergyDelta + netCounterDelta;
      const pairwiseBlueWR = Math.min(82, Math.max(18, Number((50.0 + pairwiseRawScore).toFixed(1))));

      const logitInput = (pairwiseRawScore + netNeuralResidual) * 0.046;
      const neuralBlueWR = Math.min(84, Math.max(16, Number((sigmoid(logitInput) * 100).toFixed(1))));

      const activeBlueWR = activeModel === 'NEURAL' ? neuralBlueWR : pairwiseBlueWR;
      const activeRedWR = Number((100 - activeBlueWR).toFixed(1));

      const lockedCount = bChamps.filter(Boolean).length + rChamps.filter(Boolean).length;
      const effectiveSampleSize = Math.max(420, Math.round(16800 - lockedCount * 950 + blueSynergies.length * 1400));
      const confidenceInterval = Number((1.96 * Math.sqrt((0.5 * 0.5) / (effectiveSampleSize / 18)) * 100).toFixed(2));

      return {
        activeBlueWR,
        activeRedWR,
        pairwiseBlueWR,
        neuralBlueWR,
        breakdown: {
          sideAdvDelta: Number(sideAdvDelta.toFixed(2)),
          netBaseDelta: Number(netBaseDelta.toFixed(2)),
          netLaneDelta: Number(netLaneDelta.toFixed(2)),
          netSynergyDelta: Number(netSynergyDelta.toFixed(2)),
          netCounterDelta: Number(netCounterDelta.toFixed(2)),
          netNeuralResidual: Number(netNeuralResidual.toFixed(2))
        },
        laneMatchups,
        blueSynergies,
        redSynergies,
        blueCountersRed,
        redCountersBlue,
        blueProfile,
        redProfile,
        effectiveSampleSize,
        confidenceInterval
      };
    }

    function getActiveRecommendationContext(roleAlignedBluePicks, roleAlignedRedPicks, allPickedOrBanned) {
      let targetSide = state.selectedSlot.side;
      let targetSlotIdx = state.selectedSlot.type === 'PICK' ? state.selectedSlot.index : 0;

      if (state.draftMode === 'TOURNAMENT' && state.tournamentStep < 20) {
        const seq = TOURNAMENT_SEQUENCE[state.tournamentStep];
        targetSide = seq.side;
        if (seq.action === 'PICK') {
          targetSlotIdx = seq.index;
        } else {
          const picks = targetSide === 'BLUE' ? state.bluePicks : state.redPicks;
          const firstEmpty = picks.findIndex(p => p === null);
          targetSlotIdx = firstEmpty !== -1 ? firstEmpty : 0;
        }
      } else {
        const picks = targetSide === 'BLUE' ? state.bluePicks : state.redPicks;
        if (state.selectedSlot.type !== 'PICK') {
          const firstEmpty = picks.findIndex(p => p === null);
          targetSlotIdx = firstEmpty !== -1 ? firstEmpty : 0;
        }
      }

      const slotRoles = targetSide === 'BLUE' ? state.blueSlotRoles : state.redSlotRoles;
      const targetRole = slotRoles[targetSlotIdx] || ROLES[targetSlotIdx];
      const targetRoleIdx = ROLES.indexOf(targetRole) !== -1 ? ROLES.indexOf(targetRole) : targetSlotIdx;

      const baseBlue = [...roleAlignedBluePicks];
      const baseRed = [...roleAlignedRedPicks];
      if (targetSide === 'BLUE') baseBlue[targetRoleIdx] = null;
      else baseRed[targetRoleIdx] = null;

      const baselineEval = evaluateCompositionEngine(baseBlue, baseRed, state.bayesianK, state.includeSideAdv, state.modelType);
      const baselineSideWR = targetSide === 'BLUE' ? baselineEval.activeBlueWR : baselineEval.activeRedWR;

      const candidates = CHAMPIONS.filter(c => {
        if (!c.roles.includes(targetRole)) return false;
        if (allPickedOrBanned.has(c.id)) return false;
        return true;
      });

      const scoredCandidates = candidates.map(champ => {
        const testBlue = [...baseBlue];
        const testRed = [...baseRed];
        if (targetSide === 'BLUE') testBlue[targetRoleIdx] = champ.id;
        else testRed[targetRoleIdx] = champ.id;

        const testEval = evaluateCompositionEngine(testBlue, testRed, state.bayesianK, state.includeSideAdv, state.modelType);
        const newSideWR = targetSide === 'BLUE' ? testEval.activeBlueWR : testEval.activeRedWR;
        const evDelta = Number((newSideWR - baselineSideWR).toFixed(2));

        return {
          champ,
          evDelta,
          projectedWR: newSideWR
        };
      });

      scoredCandidates.sort((a, b) => b.evDelta - a.evDelta);

      const banCandidates = CHAMPIONS.filter(c => !allPickedOrBanned.has(c.id)).map(champ => {
        const threatScore = (champ.baseWR - 50) * 1.4 + champ.banRate * 0.12;
        return {
          champ,
          threatScore: Number(threatScore.toFixed(1))
        };
      });

      banCandidates.sort((a, b) => b.threatScore - a.threatScore);

      return {
        targetSide,
        targetSlotIdx,
        targetRoleIdx,
        targetRole,
        topPicks: scoredCandidates.slice(0, 3),
        topBans: banCandidates.slice(0, 3)
      };
    }

    /********************************************************************
     * 3. INTERACTIVE ACTION HANDLERS
     ********************************************************************/
    function assignOptimalOpenRoleForPick(champ, side, slotIdx, desiredRoleOverride = null) {
      const currentPicks = side === 'BLUE' ? state.bluePicks : state.redPicks;
      const currentRoles = side === 'BLUE' ? [...state.blueSlotRoles] : [...state.redSlotRoles];

      const occupiedRoles = new Set();
      currentPicks.forEach((pId, idx) => {
        if (idx !== slotIdx && pId !== null) {
          occupiedRoles.add(currentRoles[idx]);
        }
      });

      const availableRoles = ROLES.filter(r => !occupiedRoles.has(r));
      let chosenRole = null;

      if (desiredRoleOverride && !occupiedRoles.has(desiredRoleOverride)) {
        chosenRole = desiredRoleOverride;
      } else if (state.roleFilter !== 'ALL' && champ.roles.includes(state.roleFilter) && !occupiedRoles.has(state.roleFilter)) {
        chosenRole = state.roleFilter;
      } else if (champ.roles.includes(currentRoles[slotIdx]) && !occupiedRoles.has(currentRoles[slotIdx])) {
        chosenRole = currentRoles[slotIdx];
      } else {
        const openValidRole = champ.roles.find(r => !occupiedRoles.has(r));
        chosenRole = openValidRole || availableRoles[0] || currentRoles[slotIdx];
      }

      const existingRoleSlotIdx = currentRoles.indexOf(chosenRole);
      if (existingRoleSlotIdx !== -1 && existingRoleSlotIdx !== slotIdx) {
        currentRoles[existingRoleSlotIdx] = currentRoles[slotIdx];
      }
      currentRoles[slotIdx] = chosenRole;

      if (side === 'BLUE') state.blueSlotRoles = currentRoles;
      else state.redSlotRoles = currentRoles;
    }

    window.handleChampionSelect = function(champId, explicitRole = null, evt = null) {
      if (evt) evt.stopPropagation();
      const allPickedOrBanned = getAllPickedOrBannedSet();
      if (allPickedOrBanned.has(champId)) return;
      const champ = CHAMP_MAP[champId];
      if (!champ) return;

      if (state.draftMode === 'TOURNAMENT' && state.tournamentStep < 20) {
        const stepObj = TOURNAMENT_SEQUENCE[state.tournamentStep];
        if (stepObj.side === 'BLUE' && stepObj.action === 'BAN') {
          state.blueBans[stepObj.index] = champId;
        } else if (stepObj.side === 'RED' && stepObj.action === 'BAN') {
          state.redBans[stepObj.index] = champId;
        } else if (stepObj.side === 'BLUE' && stepObj.action === 'PICK') {
          state.bluePicks[stepObj.index] = champId;
          assignOptimalOpenRoleForPick(champ, 'BLUE', stepObj.index, explicitRole);
        } else if (stepObj.side === 'RED' && stepObj.action === 'PICK') {
          state.redPicks[stepObj.index] = champId;
          assignOptimalOpenRoleForPick(champ, 'RED', stepObj.index, explicitRole);
        }
        state.tournamentStep = Math.min(20, state.tournamentStep + 1);
        renderApp();
        return;
      }

      const { side, type, index } = state.selectedSlot;
      if (type === 'PICK') {
        if (side === 'BLUE') {
          state.bluePicks[index] = champId;
          assignOptimalOpenRoleForPick(champ, 'BLUE', index, explicitRole);
          const nextEmpty = state.bluePicks.findIndex((val, i) => i > index && val === null);
          const anyEmpty = state.bluePicks.findIndex(val => val === null);
          if (nextEmpty !== -1) state.selectedSlot = { side: 'BLUE', type: 'PICK', index: nextEmpty };
          else if (anyEmpty !== -1) state.selectedSlot = { side: 'BLUE', type: 'PICK', index: anyEmpty };
        } else {
          state.redPicks[index] = champId;
          assignOptimalOpenRoleForPick(champ, 'RED', index, explicitRole);
          const nextEmpty = state.redPicks.findIndex((val, i) => i > index && val === null);
          const anyEmpty = state.redPicks.findIndex(val => val === null);
          if (nextEmpty !== -1) state.selectedSlot = { side: 'RED', type: 'PICK', index: nextEmpty };
          else if (anyEmpty !== -1) state.selectedSlot = { side: 'RED', type: 'PICK', index: anyEmpty };
        }
      } else {
        if (side === 'BLUE') {
          state.blueBans[index] = champId;
          const nextEmpty = state.blueBans.findIndex((val, i) => i > index && val === null);
          if (nextEmpty !== -1) state.selectedSlot = { side: 'BLUE', type: 'BAN', index: nextEmpty };
        } else {
          state.redBans[index] = champId;
          const nextEmpty = state.redBans.findIndex((val, i) => i > index && val === null);
          if (nextEmpty !== -1) state.selectedSlot = { side: 'RED', type: 'BAN', index: nextEmpty };
        }
      }
      renderApp();
    };

    window.handleChangeSlotRole = function(side, slotIdx, newRole, evt) {
      if (evt) evt.stopPropagation();
      const currentPicks = side === 'BLUE' ? state.bluePicks : state.redPicks;
      const currentRoles = side === 'BLUE' ? [...state.blueSlotRoles] : [...state.redSlotRoles];

      if (currentPicks[slotIdx] === null) {
        const isLockedByPickedChamp = currentPicks.some(
          (pId, idx) => idx !== slotIdx && pId !== null && currentRoles[idx] === newRole
        );
        if (isLockedByPickedChamp) return;
      }

      const existingIdx = currentRoles.indexOf(newRole);
      if (existingIdx !== -1 && existingIdx !== slotIdx) {
        if (currentPicks[existingIdx] !== null && currentPicks[slotIdx] === null) {
          return;
        }
        currentRoles[existingIdx] = currentRoles[slotIdx];
      }
      currentRoles[slotIdx] = newRole;

      if (side === 'BLUE') state.blueSlotRoles = currentRoles;
      else state.redSlotRoles = currentRoles;
      renderApp();
    };

      state.selectedSlot = { side, type, index };
      renderApp();
    };

    window.handleFlexSwapClick = function(side, index, evt) {
      if (evt) evt.stopPropagation();
      if (!state.flexSource) {
        state.flexSource = { side, index };
        renderApp();
        return;
      }
      if (state.flexSource.side !== side) {
        state.flexSource = { side, index };
        renderApp();
        return;
      }
      if (state.flexSource.index === index) {
        state.flexSource = null;
        renderApp();
        return;
      }

      if (side === 'BLUE') {
        const nextRoles = [...state.blueSlotRoles];
        const temp = nextRoles[state.flexSource.index];
        nextRoles[state.flexSource.index] = nextRoles[index];
        nextRoles[index] = temp;
        state.blueSlotRoles = nextRoles;
      } else {
        const nextRoles = [...state.redSlotRoles];
        const temp = nextRoles[state.flexSource.index];
        nextRoles[state.flexSource.index] = nextRoles[index];
        nextRoles[index] = temp;
        state.redSlotRoles = nextRoles;
      }
      state.flexSource = null;
      renderApp();
    };

        else state.redPicks[idx] = null;

        else state.redBans[idx] = null;

        state.blueSlotRoles = ['TOP', 'JGL', 'MID', 'BOT', 'SUP'];

      state.redBans = [null, null, null, null, null];

      state.redSlotRoles = ['TOP', 'JGL', 'MID', 'BOT', 'SUP'];

      state.redPicks = [...preset.redPicks];

      state.redBans = [...preset.redBans];
      state.blueSlotRoles = ['TOP', 'JGL', 'MID', 'BOT', 'SUP'];
      state.redSlotRoles = ['TOP', 'JGL', 'MID', 'BOT', 'SUP'];
      state.tournamentStep = preset.step;

    window.handleApplyRecommendation = function(champId, isBan) {
      const allPickedOrBanned = getAllPickedOrBannedSet();
      if (allPickedOrBanned.has(champId)) return;
      const roleAlignedBlue = getRoleAlignedIds(state.bluePicks, state.blueSlotRoles);
      const roleAlignedRed = getRoleAlignedIds(state.redPicks, state.redSlotRoles);
      const recCtx = getActiveRecommendationContext(roleAlignedBlue, roleAlignedRed, allPickedOrBanned);

      if (isBan) {
        if (recCtx.targetSide === 'BLUE') {
          const emptyIdx = state.blueBans.findIndex(x => x === null);
          state.blueBans[emptyIdx !== -1 ? emptyIdx : 4] = champId;
        } else {
          const emptyIdx = state.redBans.findIndex(x => x === null);
          state.redBans[emptyIdx !== -1 ? emptyIdx : 4] = champId;
        }
      } else {
        const champ = CHAMP_MAP[champId];
        if (recCtx.targetSide === 'BLUE') {
          state.bluePicks[recCtx.targetSlotIdx] = champId;
          if (champ) assignOptimalOpenRoleForPick(champ, 'BLUE', recCtx.targetSlotIdx, recCtx.targetRole);
        } else {
          state.redPicks[recCtx.targetSlotIdx] = champId;
          if (champ) assignOptimalOpenRoleForPick(champ, 'RED', recCtx.targetSlotIdx, recCtx.targetRole);
        }
      }
      renderApp();
    };

                      <div class="flex items-center justify-between text-[11px] font-mono text-slate-400">
                        <span class="text-cyan-300">${m.blueLaneWR}% WR</span>
                        <span>GD@15: <strong class="${m.gd15 >= 0 ? 'text-cyan-300' : 'text-rose-400'}">${m.gd15 >= 0 ? '+' : ''}${m.gd15}g</strong> • XP: ${m.xpd15 >= 0 ? '+' : ''}${m.xpd15}</span>
                        <span class="text-rose-300">${(100 - m.blueLaneWR).toFixed(1)}% WR</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Synergies & Counters -->
              <div class="lg:col-span-4 bg-[#0c1322] border border-slate-800/90 rounded-xl p-4 space-y-4">
                <div class="space-y-2">
                  <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-200">⚡ Active Duo & Trio Synergies</h3>
                  </div>
                  ${analysis.blueSynergies.length === 0 && analysis.redSynergies.length === 0 ? `
                    <p class="text-xs text-slate-500 py-2 italic">No empirical pairings detected yet (Try Lucian+Nami, Yasuo+Diana, or Jinx+Thresh).</p>
                  ` : `
                    <div class="space-y-2 max-h-[180px] overflow-y-auto pr-1">
                      ${analysis.blueSynergies.map(s => `
                        <div class="p-2 rounded-lg bg-cyan-950/30 border border-cyan-500/30">
                          <div class="flex items-center justify-between text-xs font-bold text-cyan-300">
                            <span>BLUE: ${s.champs.join(' + ')}</span>
                            <span class="font-mono text-emerald-400">+${s.smoothedDelta}% WR</span>
                          </div>
                          <div class="text-[11px] text-slate-300 mt-0.5">${s.label}</div>
                        </div>
                      `).join('')}
                      ${analysis.redSynergies.map(s => `
                        <div class="p-2 rounded-lg bg-rose-950/30 border border-rose-500/30">
                          <div class="flex items-center justify-between text-xs font-bold text-rose-300">
                            <span>RED: ${s.champs.join(' + ')}</span>
                            <span class="font-mono text-emerald-400">+${s.smoothedDelta}% WR</span>
                          </div>
                          <div class="text-[11px] text-slate-300 mt-0.5">${s.label}</div>
                        </div>
                      `).join('')}
                    </div>
                  `}
                </div>

                <div class="space-y-2 pt-1">
                  <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-200">🎯 Cross-Map Counter Interactions</h3>
                  </div>
                  ${analysis.blueCountersRed.length === 0 && analysis.redCountersBlue.length === 0 ? `
                    <p class="text-xs text-slate-500 py-2 italic">No severe kit counters active (e.g., Sylas into Malphite, Poppy into dashes).</p>
                  ` : `
                    <div class="space-y-2 max-h-[200px] overflow-y-auto pr-1">
                      ${analysis.blueCountersRed.map(c => `
                        <div class="p-2 rounded-lg bg-cyan-950/30 border border-cyan-500/30">
                          <div class="flex items-center justify-between text-xs font-bold text-cyan-300">
                            <span>BLUE ${c.attacker} → ${c.victim}</span>
                            <span class="font-mono text-cyan-300">+${c.smoothedDelta}%</span>
                          </div>
                          <div class="text-[10px] font-mono uppercase text-amber-300">${c.type}</div>
                        </div>
                      `).join('')}
                      ${analysis.redCountersBlue.map(c => `
                        <div class="p-2 rounded-lg bg-rose-950/30 border border-rose-500/30">
                          <div class="flex items-center justify-between text-xs font-bold text-rose-300">
                            <span>RED ${c.attacker} → ${c.victim}</span>
                            <span class="font-mono text-rose-300">+${c.smoothedDelta}%</span>
                          </div>
                          <div class="text-[10px] font-mono uppercase text-amber-300">${c.type}</div>
                        </div>
                      `).join('')}
                    </div>
                  `}
                </div>
              </div>

              <!-- Composition Profiling & Utility Vectors -->
              <div class="lg:col-span-4 bg-[#0c1322] border border-slate-800/90 rounded-xl p-4 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                  <h3 class="text-xs font-bold uppercase tracking-wider text-slate-200">📊 Composition Profiling & Utility Vectors</h3>
                </div>

                <div class="space-y-2">
                  <div class="text-[11px] font-mono text-slate-300 flex justify-between">
                    <span class="text-cyan-300 font-bold">Blue Damage Split</span>
                    <span>${analysis.blueProfile.isEmpty ? 'Awaiting Blue...' : `${analysis.blueProfile.dmgProfile.ad}% AD • ${analysis.blueProfile.dmgProfile.ap}% AP • ${analysis.blueProfile.dmgProfile.true}% True`}</span>
                  </div>
                  <div class="h-2.5 rounded-full bg-slate-900 overflow-hidden flex border border-slate-800">
                    <div style="width: ${analysis.blueProfile.dmgProfile.ad}%" class="bg-orange-500 transition-all"></div>
                    <div style="width: ${analysis.blueProfile.dmgProfile.ap}%" class="bg-sky-400 transition-all"></div>
                    <div style="width: ${analysis.blueProfile.dmgProfile.true}%" class="bg-slate-100 transition-all"></div>
                  </div>

                  <div class="text-[11px] font-mono text-slate-300 flex justify-between pt-1">
                    <span class="text-rose-400 font-bold">Red Damage Split</span>
                    <span>${analysis.redProfile.isEmpty ? 'Awaiting Red...' : `${analysis.redProfile.dmgProfile.ad}% AD • ${analysis.redProfile.dmgProfile.ap}% AP • ${analysis.redProfile.dmgProfile.true}% True`}</span>
                  </div>
                  <div class="h-2.5 rounded-full bg-slate-900 overflow-hidden flex border border-slate-800">
                    <div style="width: ${analysis.redProfile.dmgProfile.ad}%" class="bg-orange-500 transition-all"></div>
                    <div style="width: ${analysis.redProfile.dmgProfile.ap}%" class="bg-sky-400 transition-all"></div>
                    <div style="width: ${analysis.redProfile.dmgProfile.true}%" class="bg-slate-100 transition-all"></div>
                  </div>
                </div>

                <div class="space-y-2">
                  ${[
                    { key: 'cc', label: 'Crowd Control (CC)' },
                    { key: 'frontline', label: 'Frontline / Durability' },
                    { key: 'engage', label: 'Engage / Pick Threat' },
                    { key: 'waveclear', label: 'Waveclear' },
                    { key: 'sidelane', label: 'Side-Lane Pressure' }
                  ].map(v => {
                    const bVal = analysis.blueProfile.vectors[v.key];
                    const rVal = analysis.redProfile.vectors[v.key];
                    return `
                      <div class="space-y-1">
                        <div class="flex justify-between text-[11px] font-mono">
                          <span class="text-cyan-300 font-bold">${bVal}/10</span>
                          <span class="text-slate-300">${v.label}</span>
                          <span class="text-rose-400 font-bold">${rVal}/10</span>
                        </div>
                        <div class="grid grid-cols-2 gap-1 h-1.5">
                          <div class="bg-slate-900 rounded-l overflow-hidden flex justify-end">
                            <div style="width: ${bVal * 10}%" class="bg-cyan-400 h-full"></div>
                          </div>
                          <div class="bg-slate-900 rounded-r overflow-hidden flex justify-start">
                            <div style="width: ${rVal * 10}%" class="bg-rose-500 h-full"></div>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </main>
        ` : `
          <!-- Architecture & ETL Tab -->
          <main class="max-w-[1600px] mx-auto px-4 py-6 space-y-6">
            <div class="bg-[#0c1322] border border-slate-800 rounded-xl p-5 space-y-4">
              <h2 class="text-base font-bold uppercase tracking-wider text-amber-300">
                2.1 Combinatorial Draft Problem & Analytical Model Comparison
              </h2>
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div class="lg:col-span-7 overflow-x-auto">
                  <table class="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr class="border-b border-slate-800 text-slate-400 font-mono uppercase">
                        <th class="py-2.5 px-3">Approach</th>
                        <th class="py-2.5 px-3">How It Works</th>
                        <th class="py-2.5 px-3">Pros</th>
                        <th class="py-2.5 px-3">Cons</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/80">
                      <tr class="${state.modelType === 'PAIRWISE' ? 'bg-cyan-950/25' : ''}">
                        <td class="py-3 px-3 font-bold text-cyan-300">Pairwise Additive</td>
                        <td class="py-3 px-3 text-slate-300">Sums base WR + lane matchups + synergies - counters.</td>
                        <td class="py-3 px-3 text-emerald-300">Interpretable, low latency.</td>
                        <td class="py-3 px-3 text-rose-300">Struggles with holistic comp synergy.</td>
                      </tr>
                      <tr class="${state.modelType === 'NEURAL' ? 'bg-purple-950/25' : ''}">
                        <td class="py-3 px-3 font-bold text-purple-300">Neural 5v5 Logistic</td>
                        <td class="py-3 px-3 text-slate-300">Entity-embedded vector representation trained on Diamond+.</td>
                        <td class="py-3 px-3 text-emerald-300">Captures non-linear 5v5 interactions.</td>
                        <td class="py-3 px-3 text-rose-300">Black-box model.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div class="lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-xl p-4 font-mono text-xs space-y-2.5">
                  <div class="text-amber-300 font-bold uppercase flex items-center justify-between">
                    <span>Live Equation Telemetry</span>
                  </div>
                  <div class="p-2.5 rounded bg-slate-950 border border-slate-800 text-[11px] text-slate-300 space-y-1">
                    <div class="text-cyan-400">// Pairwise Linear Predictor</div>
                    <div>η = Side(${analysis.breakdown.sideAdvDelta}%) + Base(${analysis.breakdown.netBaseDelta}%) + Lane(${analysis.breakdown.netLaneDelta}%)</div>
                    <div class="text-emerald-400 font-bold pt-1">⇒ P(Blue) = ${analysis.pairwiseBlueWR}% | Neural = ${analysis.neuralBlueWR}%</div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        `}
      `;

      // Restore scroll position and search focus if typing
      const newGrid = document.getElementById('champion-pool-grid');
      if (newGrid) newGrid.scrollTop = prevScrollTop;

      if (preserveSearchFocus) {
        const searchEl = document.getElementById('champ-search-input');
        if (searchEl) {
          searchEl.focus();
          const len = searchEl.value.length;
          searchEl.setSelectionRange(len, len);
        }
      }
    }

    // Boot on window load
    window.onload = function() {
      initFromUrl();
      renderApp();
    };
  </script>
</body>
</html>
